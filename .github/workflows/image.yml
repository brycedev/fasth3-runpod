name: fasth3-sm100a-image

# Default GHA runners do not have enough disk for CUDA 13 + in-tree sm100a.
# This job starts a RunPod CPU builder (kaniko, no B200) and pushes to GHCR
# using the job-scoped GITHUB_TOKEN (write:packages).

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  kaniko-on-runpod:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Build and push via RunPod CPU
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: python3 scripts/runpod_kaniko.py
