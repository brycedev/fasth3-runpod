name: fasth3-sm100a-image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 12288
          temp-reserve-mb: 4096
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - uses: actions/checkout@v4

      - name: Disk
        run: df -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runpod/Dockerfile.fasth3
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/brycedev/fasth3-runpod:sm100a
            ghcr.io/brycedev/fasth3-runpod:latest
          provenance: false
